# SKOVO Frontend — Nginx config
# Serves React SPA, proxies /v1/ API calls to Flask backend

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options    "nosniff"                       always;
    add_header X-XSS-Protection          "1; mode=block"                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # HSTS (X01-010). Six months, and deliberately WITHOUT `includeSubDomains`
    # or `preload`: HSTS pins a browser to HTTPS for the whole max-age with no
    # click-through, and skovoinfo.com currently has no working certificate.
    # Covering subdomains or preloading while a cert is broken takes the site
    # off the air for anyone who has visited it once. Widen this only after
    # every domain serves a valid certificate.
    #
    # TLS is terminated upstream (this block listens on 80), so a browser only
    # ever honours this when the connection it arrived on was HTTPS.
    add_header Strict-Transport-Security "max-age=15768000"              always;

    # frame-ancestors is the modern form of X-Frame-Options; both are sent
    # because some review scanners still look for the legacy header. 'self'
    # matches the SAMEORIGIN above. X01-018.
    add_header Content-Security-Policy   "frame-ancestors 'self'"        always;

    # ── Health check endpoint (used by Docker HEALTHCHECK + ALB) ──────────────
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ── API proxy → Flask backend ──────────────────────────────────────────────
    # All /v1/* calls forwarded to the backend container
    location /v1/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;

        # File upload support
        client_max_body_size 50M;
    }

    # ── Uploaded files → Flask backend ────────────────────────────────────────
    # Stored files are referenced as "/uploads/<name>" and rendered into
    # <img src> / <a href>. Without this location they fall through to the SPA
    # catch-all below and return index.html, so the image fails to decode and
    # the page shows the default avatar — with the upload having succeeded.
    # The backend serves the file from disk, or 302s to a short-lived presigned
    # S3 URL, so the bucket stays private.
    location /uploads/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
    }

    # ── Immutable static assets (hashed filenames from Vite) ──────────────────
    #
    # NOTE, and it is the whole reason the headers are repeated below: nginx
    # inherits `add_header` from an outer level ONLY IF the current level
    # defines none of its own. Both of these locations set Cache-Control, which
    # silently dropped all five security headers from every response they
    # serve -- including `location /`, which is every HTML page of the SPA. The
    # headers were in the config and on none of the pages that matter.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        add_header X-Frame-Options           "SAMEORIGIN"                    always;
        add_header X-Content-Type-Options    "nosniff"                       always;
        add_header X-XSS-Protection          "1; mode=block"                 always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=15768000"              always;
        add_header Content-Security-Policy   "frame-ancestors 'self'"        always;

        access_log off;
    }

    # ── React SPA fallback — all routes serve index.html ──────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        # Repeated, not inherited — see the note above.
        add_header X-Frame-Options           "SAMEORIGIN"                    always;
        add_header X-Content-Type-Options    "nosniff"                       always;
        add_header X-XSS-Protection          "1; mode=block"                 always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=15768000"              always;
        add_header Content-Security-Policy   "frame-ancestors 'self'"        always;
    }
}
